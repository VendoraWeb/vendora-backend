name: Build & Test Backend

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Vet
      run: go vet ./...

    - name: Test & Coverage
      run: go test -v -coverprofile=coverage.out ./... && go tool cover -func=coverage.out

    - name: Build
      run: go build -v ./...
